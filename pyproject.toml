[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallet-crypto"
version = "1.0.0"
description = "Suivi de patrimoine crypto auto-hébergé : wallets, staking, hold et trades Hyperliquid. Lecture seule, en français."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Arnaud (Patart50)" }]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "requests>=2.31",
    "nicegui>=2.20,<4",
    "segno>=1.6",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: French",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Source = "https://github.com/Patart50/wallet-crypto"
Sponsor = "https://github.com/sponsors/Patart50"

[project.scripts]
wallet-crypto = "wallet_crypto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wallet_crypto.ui" = ["static/*.svg", "static/fonts/*"]
"wallet_crypto.db" = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# NiceGUI : l'imbrication des « with » suit l'arbre de la page, la fusionner nuit à la lecture
"src/wallet_crypto/ui/*" = ["SIM117"]
