name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    env:
      # Tag de commun-crypto dont les adresses de don sont comparées à support.py (wallet D-012)
      COMMUN_CRYPTO_TAG: v1.2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installer
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests && ruff format --check src tests
      - name: Récupérer les adresses de don de commun-crypto
        run: |
          git clone --depth 1 --branch "$COMMUN_CRYPTO_TAG" https://github.com/Patart50/commun-crypto /tmp/commun-crypto
          echo "COMMUN_CRYPTO_SUPPORT=/tmp/commun-crypto/src/support.ts" >> "$GITHUB_ENV"
      - name: Tests
        run: pytest -q
