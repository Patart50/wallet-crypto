name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    env:
      # Tag de commun-crypto dont les adresses de don sont comparées à support.py (wallet D-012)
      COMMUN_CRYPTO_TAG: v1.2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installer
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests && ruff format --check src tests
      - name: Récupérer les adresses de don de commun-crypto
        run: |
          git clone --depth 1 --branch "$COMMUN_CRYPTO_TAG" https://github.com/Patart50/commun-crypto /tmp/commun-crypto
          echo "COMMUN_CRYPTO_SUPPORT=/tmp/commun-crypto/src/support.ts" >> "$GITHUB_ENV"
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t wallet-crypto:ci .
      - name: Lancer en racine en lecture seule, utilisateur non root
        run: |
          mkdir -p data && sudo chown 10001 data
          docker run -d --name wc -p 127.0.0.1:8090:8090 -v "$PWD/data:/data" \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges wallet-crypto:ci
          for i in $(seq 40); do curl -fsS http://127.0.0.1:8090/a-propos > /dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:8090/ | grep -q "Bienvenue"
          test "$(docker exec wc id -u)" = "10001"
          test -f data/wallet-crypto.db
      - name: Journal du conteneur
        if: always()
        run: docker logs wc || true
